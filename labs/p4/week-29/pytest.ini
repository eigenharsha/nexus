[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    basic: acceptance test for the `basic` track (runs on every track)
    standard: acceptance test for the `standard` track
    hard: acceptance test for the `hard` track (the extra constraint)
    all: runs on every track regardless of level
    slow: excluded from `make verify`; run explicitly with `-m slow`

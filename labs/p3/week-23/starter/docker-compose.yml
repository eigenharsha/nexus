# TODO (standard): bring the service up with its dependencies.
# The point of compose here is that `docker compose up` must be the only command a
# reviewer needs. If your README says "first start Postgres, then...", it is not done.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: /app/artifacts/model.pt
      MODEL_SHA256: "" # TODO: pin it; /version must report what is actually loaded
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 3

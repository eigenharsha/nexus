# TODO (standard): scale on CPU. TODO (hard): scale on queue depth instead, and say
# in RUNBOOK.md why CPU is the wrong signal for this workload — an inference server
# that is blocked on a slow downstream is at 5% CPU and completely saturated.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prediction-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prediction-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # scale down slowly; flapping is worse than cost

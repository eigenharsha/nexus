# TODO (standard): the Deployment for the Week-23 image.
#
# The part everyone guesses and should not: `resources`. Measure actual usage under
# load first (`kubectl top pod` while the load test runs), then set requests near the
# p50 and limits near the p99. Requests decide scheduling; limits decide throttling
# and OOMKills. A request that is too high wastes a third of the cluster; one that is
# too low gets your pod evicted at 3 a.m.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
  labels: { app: prediction-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: prediction-service }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # zero-downtime requires 0 here, and a readinessProbe
  template:
    metadata:
      labels: { app: prediction-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: prediction-service:latest   # TODO: pin a digest, not :latest
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: prediction-config }
            - secretRef: { name: prediction-secrets }
          # TODO: startupProbe, livenessProbe, readinessProbe.
          # They are three different questions:
          #   startup   — has the model finished loading? (generous failureThreshold)
          #   liveness  — is the process wedged? (restart if it fails)
          #   readiness — can it serve right now? (remove from the Service if it fails)
          # Using the same endpoint for all three is how a slow model load turns into
          # a restart loop.
          resources:
            requests: { cpu: "TODO", memory: "TODO" }
            limits:   { cpu: "TODO", memory: "TODO" }

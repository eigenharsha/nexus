<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="t-p1-w06-m4 d-p1-w06-m4" font-family="'Caveat', 'Kalam', cursive, sans-serif">
<title id="t-p1-w06-m4">Three gates. Skipping the third one is called IDOR.</title>
<desc id="d-p1-w06-m4">A request carrying a token passes through three gates: authentication answering who you are, route authorization answering whether your role may call this endpoint, and a thick green object-level gate answering whether row 4102 actually belongs to user 7. A red arrow going from the second gate straight to the database is crossed out and labelled IDOR. Bars compare argon2id hashing at 65.5 ms with bcrypt at cost 10, 12 and 14.</desc>
<style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&amp;family=Kalam:wght@300;400;700&amp;display=swap');text{font-family:'Caveat', 'Kalam', cursive, sans-serif;}</style>
<rect width="1000" height="660" fill="#1a1a19"/>
<text x="28" y="40" font-size="37.7" fill="#e8e6e3" text-anchor="start" font-weight="700">Three gates. Skipping the third one is called IDOR.</text>

<text x="618" y="344" font-size="21.8" fill="#ff6b6b" text-anchor="middle">IDOR: GET /invoices/4102 returns someone else's invoice</text>
<text x="40" y="275" font-size="21.8" fill="#ffb84d" text-anchor="start" transform="rotate(-1.2 40 275)">gate 3 is the one everyone forgets, and it is</text>
<text x="40" y="300" font-size="21.8" fill="#ffb84d" text-anchor="start" transform="rotate(-1.2 40 300)">the most common serious API bug there is. The</text>
<text x="40" y="325" font-size="21.8" fill="#ffb84d" text-anchor="start" transform="rotate(-1.2 40 325)">first two both said yes.</text>

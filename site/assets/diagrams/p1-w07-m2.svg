<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="t-p1-w07-m2 d-p1-w07-m2" font-family="'Caveat', 'Kalam', cursive, sans-serif">
<title id="t-p1-w07-m2">The FK lives on the many side</title>
<desc id="d-p1-w07-m2">Customers linked one-to-many to orders with the crow's foot and the foreign key drawn on the orders side. Below, a direct many-to-many link between orders and products is crossed out in red because there is nowhere to put the key, and redrawn with an order_items junction table holding the composite primary key plus quantity and unit price. Three side boxes give the rules for money, time and status columns.</desc>

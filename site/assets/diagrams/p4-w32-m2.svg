<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t-p4-w32-m2 d-p4-w32-m2" font-family="'Caveat', 'Kalam', cursive, sans-serif">
<title id="t-p4-w32-m2">The flywheel: a trace becomes a test becomes a fix</title>
<desc id="d-p4-w32-m2">A hand-drawn, deliberately lopsided circle of five boxes with clockwise arrows: a production trace, an online score from a judge and user thumbs taken automatically in about 600 milliseconds, a labelled eval case created in four minutes where nine days is struck out, a versioned prompt v8 gated by the eval suite, and a deployment whose traces are tagged with the prompt version, closing back to production and verified there rather than only in CI. In the centre a small growth chart shows the eval suite going from 120 to 167 cases and the online score from 78 to 88 percent over eight weeks; below, a straight 'failure, fix, hope' arrow is struck through as no verification means no learning.</desc>
<style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&amp;family=Kalam:wght@300;400;700&amp;display=swap');text{font-family:'Caveat', 'Kalam', cursive, sans-serif;}</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" role="img" aria-labelledby="t-p4-w29-m2 d-p4-w29-m2" font-family="'Caveat', 'Kalam', cursive, sans-serif">
<title id="t-p4-w29-m2">One tool call is four messages on a wire</title>
<desc id="d-p4-w29-m2">A hand-drawn sequence diagram between two lifelines, your process on the left and the model API on the right. Step one sends messages plus tool schemas, resent every turn and costing about 4,200 tokens for thirty tools. Step two returns a tool_use block with name, id and input. Step three is a self-loop on the left that validates arguments with Pydantic, runs the function and truncates the output, with a red ValidationError branch that returns the error as text rather than raising it into the void, which is drawn and struck through. Step four sends tool_result with a matching tool_use_id, annotated that a mismatch is a 400.</desc>
<style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&amp;family=Kalam:wght@300;400;700&amp;display=swap');text{font-family:'Caveat', 'Kalam', cursive, sans-serif;}</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="t-p1-w06-m5 d-p1-w06-m5" font-family="'Caveat', 'Kalam', cursive, sans-serif">
<title id="t-p1-w06-m5">Most tests need no network. Capacity is at the knee.</title>
<desc id="d-p1-w06-m5">A test pyramid with a wide base of unit tests at about 1 ms each, a middle band of TestClient endpoint tests at about 50 ms each, and a narrow top of contract and smoke tests against a deployment. Beside it, a plot of offered concurrency against throughput and p99 latency: throughput rises then flattens while p99 climbs steeply, and the crossing point is ringed and labelled THE KNEE. The average-latency curve is crossed out as useless. Below, /healthz and /readyz are separated, with one shared handler crossed out.</desc>
<style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&amp;family=Kalam:wght@300;400;700&amp;display=swap');text{font-family:'Caveat', 'Kalam', cursive, sans-serif;}</style>

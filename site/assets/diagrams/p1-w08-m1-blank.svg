<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="t-p1-w08-m1 d-p1-w08-m1" font-family="'Caveat', 'Kalam', cursive, sans-serif">
<title id="t-p1-w08-m1">The log is flushed first. That is why &quot;none&quot; survives a power cut.</title>
<desc id="d-p1-w08-m1">Blank version of the sketch “The log is flushed first. That is why &quot;none&quot; survives a power cut.” with all labels removed, for drawing from memory. A transaction box with BEGIN at the top and COMMIT at the bottom containing a debit of 50 000 and a matching credit, struck by a red lightning bolt labelled kill -9. The balances before and after the crash are identical at 100 000 each. Below, a numbered pair of steps shows the write-ahead log record being fsynced first and the data pages written later, with the reversed order crossed out in red.</desc>
<style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&amp;family=Kalam:wght@300;400;700&amp;display=swap');text{font-family:'Caveat', 'Kalam', cursive, sans-serif;}</style>

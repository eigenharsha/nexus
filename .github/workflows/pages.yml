name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install mkdocs-material pymdown-extensions pyyaml

      # The site is authored as Mintlify MDX. Mintlify has no static export, so
      # publishing anywhere else means rendering with a different generator.
      # convert.py maps every component the course uses onto MkDocs Material -
      # critically the tabs (three layers) and details (hint ladder, checkpoint
      # answers), which carry the teaching rather than the styling.
      - name: Convert MDX to Markdown
        run: python3 publish/convert.py

      - name: Build
        working-directory: publish
        run: python3 -m mkdocs build

      # A project site is served from /<repo>/, so links must be relative.
      # convert.py rewrites Mintlify's absolute /a/b links accordingly.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

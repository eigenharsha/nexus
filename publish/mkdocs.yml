site_name: Nexus
site_description: Systems, Machine Learning & Distributed AI — 0 to expert in 32 weeks.
docs_dir: docs
site_dir: ../_site
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - navigation.footer
  - search.suggest
  - search.highlight
  - search.share
  - content.code.copy
  - toc.follow
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: blue
    accent: blue
    toggle:
      icon: material/weather-night
      name: Dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue
    accent: blue
    toggle:
      icon: material/weather-sunny
      name: Light mode
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
markdown_extensions:
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- admonition
- attr_list
- md_in_html
- tables
- footnotes
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight
- pymdownx.inlinehilite
plugins:
- search
